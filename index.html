<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Danny VG</title>
    <meta name="description" content="Danny VG — links." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Danny VG" />
    <meta property="og:description" content="Danny VG — links." />
    <meta property="og:image" content="/og.png" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Danny VG" />
    <meta name="twitter:description" content="Danny VG — links." />
    <meta name="twitter:image" content="/og.png" />

    <!-- Fonts: Space Grotesk (name) + Inter (everything else), swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Galaxy base color inline to kill white-flash on first paint. It MUST live
      on <html> only, never <body>: the theme background canvas is fixed at
      z-index:-10, which paints above the root (html) background but below normal
      in-flow content. An opaque <body> background is in-flow content, so it would
      paint OVER the canvas and hide every theme. <html> keeps the base color
      (sits behind the canvas → no white flash); <body> stays transparent.
    -->
    <style>
      html {
        margin: 0;
        background: #0a0118;
        color: #f5f3ff;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 480px; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; text-align: center;">
        <h1>Danny VG</h1>
        <p><a style="color: #8be9ff;" href="#">Instagram</a></p>
        <p><a style="color: #8be9ff;" href="#">TikTok</a></p>
        <p style="opacity: 0.6;">Enable JavaScript for the full experience.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
